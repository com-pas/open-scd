name: Build and Deploy
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "packages/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: "true"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true
          
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: "24.x"

      - name: Install and Build OpenSCD
        run: |
          pnpm i @nx/nx-linux-x64-gnu
          pnpm clean-install
          pnpm run-script build
          pnpm run-script doc

      - name: Copy Core Docs to OpenSCD
        run: |
          cp -R packages/core/doc packages/distribution/build/core-doc

      - name: Copy Plugin Docs to OpenSCD
        run: |
          cp -R packages/plugins/doc packages/distribution/build/plugin-doc

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 #v4.9.0
        with:
          branch: master
          folder: packages/distribution/build
          repository-name: com-pas/openscd.github.io
          ssh-key: ${{ secrets.DEPLOY_KEY }}
