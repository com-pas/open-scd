name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - "packages/**"
      - ".github/workflows/pr-preview.yml"

concurrency: preview-${{ github.ref }}
env:
  PR_NUMBER: ${{ github.event.number }}

jobs:
  deploy-preview:
    # Fork PRs get a read-only GITHUB_TOKEN and cannot deploy previews.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: "true"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true
          
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "24.x"

      - name: Install and Build OpenSCD
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          pnpm i @nx/nx-linux-x64-gnu
          pnpm clean-install
          PUBLIC_URL=open-scd/pr-preview/pr-$PR_NUMBER pnpm run-script build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 #v1.8.1
        with:
          source-dir: packages/distribution/dist
          umbrella-dir: pr-preview
